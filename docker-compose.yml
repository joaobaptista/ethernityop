version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ethernity-mysql-prod
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: ethernity
      MYSQL_ROOT_HOST: '%'
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ethernity_mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - ethernity-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ethernity-backend-prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3333:3333"
      - "8000:8000"
    # Configuração do servidor (FRONTEND_URL, CORS_ORIGINS, chaves de integração...).
    # Os valores de "environment" abaixo têm prioridade sobre este arquivo.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: 3333
      SECONDARY_PORT: 8000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ethernity
      DB_USER: root
      DB_PASSWORD: ''
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no ambiente ou em um arquivo .env}
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_PHOTOS_TOKEN_ENCRYPTION_KEY: ${GOOGLE_PHOTOS_TOKEN_ENCRYPTION_KEY:-}
    healthcheck:
      # /health consulta o MySQL e responde 503 quando o banco não está acessível
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ethernity_uploads:/app/uploads
      - ethernity_vault:/app/vault_storage
    networks:
      - ethernity-network

volumes:
  ethernity_mysql_data:
    driver: local
  ethernity_uploads:
    driver: local
  ethernity_vault:
    driver: local

networks:
  ethernity-network:
    driver: bridge
